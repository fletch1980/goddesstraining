<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <style>* {box-sizing:border-box;margin:0;padding:0;} body{background:#0a0010;font-family:system-ui,sans-serif;}</style>
</head>
<body>
<div id="root"></div>
<script>
var DAYS = [
  { label:"MON", title:"🌀 Hip Isolation & Winding", sub:"Slow control · Feel every movement", exercises:[
    { name:"Standing Hip Circles", area:"Hips & Mobility", emoji:"🌀", sets:"3 × 20 each direction", notes:"Slow and controlled, make them big and deliberate. Upper body stays completely still.", tip:"The bigger and slower the circle, the more you feel the hip flexors release", howto:["Stand feet hip-width, hands on waist","Rotate hips in a full wide circle — go slow","Keep shoulders and chest completely still","20 circles one direction, then reverse","Feel the hip socket opening up with each rotation","Bigger is better here — maximize the range"] },
    { name:"Figure 8 Hip Rolls", area:"Hip Mobility & Control", emoji:"🎵", sets:"3 × 30 seconds", notes:"Draw a figure 8 with your hips. Upper body stays completely still throughout.", tip:"Imagine tracing a figure 8 on the floor — front to side, not just side to side", howto:["Stand feet hip-width, slight knee bend","Shift hips right and forward","Roll through center, shift left and back","Connect into a fluid figure 8 shape","Upper body stays still throughout","Start slow, find the shape before adding speed"] },
    { name:"Isolated Hip Pops", area:"Hip Isolation", emoji:"💥", sets:"3 × 20 each side", notes:"Pop one hip out at a time, freeze at the top. Isolation — not a full sway.", tip:"Think 'click' not 'swing' — sharp pop then hold, that builds control", howto:["Stand feet together or hip-width","Pop RIGHT hip out sharply — freeze at the top","Return to center","Pop LEFT hip out sharply — freeze","Keep upper body absolutely still","Each pop is intentional and sharp, not a swing"] },
    { name:"Kneeling Hip Winds", area:"Hip Control & Core", emoji:"🧎", sets:"3 × 30 seconds", notes:"On knees, wind hips in slow circles. Being on your knees isolates the movement.", tip:"Kneeling removes leg momentum — everything comes purely from the hip", howto:["Kneel upright, knees hip-width","Place hands on thighs or waist","Wind hips in slow full circles","Keep torso tall and still","Focus on rotating from the hip joint","30 seconds, then switch direction"] },
    { name:"Pelvic Tilts", area:"Core & Hip Foundation", emoji:"🔄", sets:"3 × 15", notes:"Standing, tuck and release pelvis — this is your base movement for everything else.", tip:"Master this and all hip movement opens up — it's the foundation", howto:["Stand feet hip-width, slight knee bend","Tuck pelvis forward — feel lower abs engage","Release and arch slightly back — lower back opens","Move slowly between the two positions","Keep movement isolated to the pelvis only","15 reps, breathe through each one"] },
    { name:"Deep Butterfly Stretch", area:"Inner Thighs & Hips", emoji:"🦋", sets:"2 × 60 sec hold", notes:"Sit tall, press knees toward floor gently. Don't force — breathe into the stretch.", tip:"Sit on a folded blanket if hips are tight — elevation helps knees drop naturally", howto:["Sit on floor, soles of feet together","Sit TALL — don't let back round","Gently press knees toward floor with elbows","Hold and breathe deeply — relax into it","Each exhale, let knees drop a little further","Never force — this is a patience stretch"] }
  ]},
  { label:"TUE", title:"🔥 Twerk & Bounce Control", sub:"Rhythm & power · Feel the music", exercises:[
    { name:"Sumo Squat Pulses", area:"Glutes & Inner Thighs", emoji:"🔥", sets:"3 × 30 pulses", notes:"Stay low in the squat the entire time. Small fast bounces — feel the burn build.", tip:"The lower you stay, the more you get — don't rise up between pulses", howto:["Feet wide, toes pointed out 45°","Lower into sumo squat — stay there","From that position, pulse up and down SMALL","Range of motion is only 2-3 inches","Stay in the burn — don't stand up","30 continuous pulses, then rest"] },
    { name:"Donkey Kick Bounce", area:"Glutes — Control & Power", emoji:"🦶", sets:"3 × 20 each leg", notes:"On all fours, kick up and add a small bounce at the top. Activates fast-twitch glute fibers.", tip:"Squeeze at the top then add the bounce — don't just flap the leg", howto:["On all fours, wrists under shoulders","Kick one leg up, sole facing ceiling","At the TOP — add a small controlled bounce","Squeeze glute with each bounce","Keep hips square — don't rotate","20 per leg, then switch"] },
    { name:"Twerk Squat", area:"Glutes — Independence & Control", emoji:"💃", sets:"3 × 20", notes:"Squat position, arch back, bounce glutes independently. This is skill work — take your time.", tip:"Arch your lower back — that's what allows glutes to move independently", howto:["Feet wider than shoulder-width, slight squat","Arch lower back — stick butt out","Bounce glutes up and down keeping back arched","Upper body stays still — glutes move independently","Start slow to find the movement","Speed up once you feel the isolation"] },
    { name:"Pop Squats", area:"Glutes & Cardio Power", emoji:"⚡", sets:"3 × 15", notes:"Jump feet out to squat, jump back in — explosive and rhythmic.", tip:"Land soft every time — quiet feet means you're absorbing through muscle, not joints", howto:["Start with feet together","Jump feet out wide, land in squat position","Immediately jump feet back together","Keep the rhythm — feel the music","Soft landings every single time","15 reps = 15 jumps out and in"] },
    { name:"Standing Booty Pop", area:"Glutes — Isolation", emoji:"🍑", sets:"3 × 30 seconds", notes:"Feet hip width, slight bend, pop glutes back alternating sides. Sharp and rhythmic.", tip:"It's a POP not a sway — sharp and intentional, one side at a time", howto:["Stand feet hip-width, soft knee bend","Pop RIGHT glute back — sharp and isolated","Return to center","Pop LEFT glute back — sharp","Alternate rhythmically","Arms can move naturally — find your flow"] },
    { name:"Hip Flexor Stretch", area:"Hip Flexors — Recovery", emoji:"🧘", sets:"2 × 60 sec each side", notes:"Low lunge, sink hips forward and down. Essential after all the bounce work.", tip:"Squeeze the BACK glute while you sink — deepens the hip flexor stretch dramatically", howto:["Step into a low lunge","Back knee on the floor, front foot flat","Sink hips FORWARD and DOWN","Squeeze back glute to increase the stretch","Hold and breathe — don't bounce","60 seconds, then switch sides"] }
  ]},
  { label:"WED", title:"💪 Core Stamina", sub:"Deep core · Slow & controlled", exercises:[
    { name:"Dead Bug", area:"Deep Core — Stability", emoji:"🐛", sets:"3 × 10 each side", notes:"Lower back stays pressed to floor the whole time — no exceptions. Slow is the point.", tip:"If your lower back lifts even slightly, make the movement smaller — range is earned", howto:["Lie on back, arms straight up, knees bent 90° in air","Press lower back FIRMLY into floor","Slowly lower opposite arm and leg toward floor","Lower back must not lift — that's the rule","Return slowly, repeat other side","Slow is the point — don't rush this"] },
    { name:"Hollow Body Hold", area:"Full Core — Endurance", emoji:"🌙", sets:"3 × 20-30 sec hold", notes:"Arms overhead, legs extended, lower back flat — breathe through it. Don't hold your breath.", tip:"Pull your belly button through the floor — that cue locks in the hollow position", howto:["Lie on back, press lower back into floor","Extend arms overhead, extend legs out","Lift arms, head, shoulders and legs slightly","Lower back stays GLUED to the floor","Hold and breathe — don't quit early","Bend knees slightly to modify if needed"] },
    { name:"Slow Mountain Climbers", area:"Core & Hip Flexors", emoji:"🏔️", sets:"3 × 20 each leg", notes:"3 seconds each rep — this is deep core work, not cardio. Slow kills the rep.", tip:"The slower you go, the more your transverse abdominis fires — speed loses the benefit", howto:["Start in plank, wrists under shoulders","Slowly drive one knee toward chest — 3 full seconds","Hold briefly at chest","Slowly extend back to plank — 3 full seconds","Switch legs","Keep hips level — don't rock side to side"] },
    { name:"Hip Dip Plank", area:"Obliques & Waist", emoji:"↔️", sets:"3 × 15 each side", notes:"Side plank, dip hip to floor and back up. This is what builds waist definition.", tip:"Slow and controlled — momentum doesn't build the waist, control does", howto:["Get into side plank — elbow under shoulder","Body in a straight line, hips stacked","Lower hip toward floor slowly","Drive hip back UP squeezing obliques","Top hand on hip or reaching toward ceiling","15 dips, then flip to other side"] },
    { name:"Reverse Crunch", area:"Lower Abs", emoji:"🔄", sets:"3 × 15", notes:"Lift hips off floor using lower abs, not momentum. Slow and intentional every single rep.", tip:"If you feel it in hip flexors more than abs, slow down even more", howto:["Lie on back, legs raised, knees slightly bent","Press lower back into floor","Using LOWER ABS, curl hips up off the floor","Knees move toward chest as hips lift","Lower slowly — don't just drop","Control every inch of the movement"] },
    { name:"Seated Twist Hold", area:"Obliques & Deep Core", emoji:"🌀", sets:"2 × 30 sec each side", notes:"Seated, lean back slightly, twist and hold. Feel it immediately in your obliques.", tip:"The lean-back is what activates the core — sit straight and you lose the benefit", howto:["Sit on floor, knees bent, feet flat","Lean back slightly — feel abs engage","Clasp hands at chest or extend arms","Rotate torso to one side and hold","Hold for 30 seconds — breathe","Switch sides — stay leaned back the whole time"] }
  ]},
  { label:"THU", title:"✨ Inner Thigh & Pelvic Floor", sub:"Precision work · Feel the detail", exercises:[
    { name:"Kegels — Quick Pulses", area:"Pelvic Floor — Activation", emoji:"✨", sets:"3 × 20 pulses", notes:"Contract and release pelvic floor rapidly. These are fast — squeeze and release in rhythm.", tip:"Think of it as blinking your pelvic floor — quick, rhythmic, deliberate", howto:["Can be done seated, standing, or lying down","Identify pelvic floor — muscles you'd use to stop urination","Contract those muscles quickly","Release fully between each pulse","20 rapid pulses = 1 set","Breathe normally throughout — never hold your breath"] },
    { name:"Kegels — Long Hold", area:"Pelvic Floor — Strength", emoji:"🔒", sets:"3 × 10 sec hold × 10", notes:"Squeeze, hold 10 seconds, fully release. The RELEASE matters just as much as the hold.", tip:"A full release after each hold prevents pelvic floor tightness — don't skip it", howto:["Get comfortable — seated or lying works best","Contract pelvic floor muscles firmly","Hold for a full 10 seconds — count it out","FULLY release — let everything go completely","Rest 5 seconds","Repeat 10 times per set"] },
    { name:"Sumo Squat Hold & Squeeze", area:"Inner Thighs & Pelvic Floor", emoji:"🦵", sets:"3 × 10 sec hold × 10", notes:"Hold sumo squat, squeeze inner thighs toward each other isometrically. You won't move.", tip:"It's an isometric squeeze — like trying to close your legs while they stay wide open", howto:["Feet wide, toes out, lower into sumo squat","Hold the squat position","Squeeze inner thighs toward each other — isometric","You won't move — just squeeze hard","Hold 10 seconds, fully release","10 holds per set — feel the inner thigh burn build"] },
    { name:"Seated Butterfly Pulses", area:"Inner Thighs", emoji:"🦋", sets:"3 × 30 pulses", notes:"Feet together, pulse knees toward floor. Inner thigh burn builds fast — breathe through it.", tip:"Sit tall — slouching moves the work from inner thighs to your back", howto:["Sit on floor, soles of feet together","Sit up TALL — back straight","Pulse both knees toward floor rapidly","Small fast movement — inner thighs drive the pulse","30 continuous pulses per set","Breathe — don't hold your breath during the burn"] },
    { name:"Resistance Band Seated Squeeze", area:"Inner Thighs — Resistance", emoji:"🟣", sets:"3 × 20", notes:"Band around knees, seated, squeeze knees together against the band. Controlled.", tip:"Band should create real resistance — too easy means you need a heavier band", howto:["Sit in a chair or on the floor","Place resistance band just above knees","Knees start pressed apart by the band","Squeeze knees TOGETHER against band's resistance","Hold 1 second at the squeeze","Release slowly — don't let band snap knees back"] },
    { name:"Bridge with Pelvic Floor Hold", area:"Glutes & Pelvic Floor", emoji:"🏋️", sets:"3 × 10 reps", notes:"At the top squeeze pelvic floor AND glutes simultaneously for 3 full seconds.", tip:"This double contraction — glutes AND pelvic floor together — is the most powerful combo here", howto:["Lie on back, feet flat, knees bent","Drive hips up into glute bridge","At the TOP — squeeze glutes hard","SIMULTANEOUSLY contract pelvic floor","Hold both for 3 full seconds","Lower slowly, fully release, repeat"] }
  ]},
  { label:"FRI", title:"🌸 Flexibility & Full Body Flow", sub:"Open up · Move freely", exercises:[
    { name:"Deep Pigeon Pose", area:"Hip Flexors & Glutes", emoji:"🕊️", sets:"2 × 90 sec each side", notes:"The most important hip opener in the program. Breathe into the tightness — don't fight it.", tip:"The more you breathe and relax into the discomfort, the faster it releases", howto:["From all fours, bring one knee forward toward same-side wrist","Extend back leg straight behind you","Lower hips toward the floor","Fold forward over front leg for deeper stretch","BREATHE — long slow exhales","90 seconds minimum — this one takes time"] },
    { name:"Figure 4 Stretch", area:"Glutes & Piriformis", emoji:"4️⃣", sets:"2 × 60 sec each side", notes:"On your back, cross ankle over knee, pull toward chest. Releases glute and piriformis.", tip:"Flex the foot of the crossed leg — protects the knee and deepens the glute stretch", howto:["Lie on your back","Cross right ankle over left knee","Flex right foot","Lift left foot, interlace hands behind left thigh","Pull both legs toward chest","Hold and breathe — feel the outer glute release"] },
    { name:"Lizard Pose", area:"Hip Flexors & Groin", emoji:"🦎", sets:"2 × 60 sec each side", notes:"Deep lunge with both hands inside front foot. One of the deepest hip flexor stretches.", tip:"Walk hands slightly further inside the foot to increase intensity", howto:["Step one foot forward into a deep lunge","Place BOTH hands inside the front foot","Lower back knee to the ground","Sink hips forward and down","Hold and breathe deeply","Drop forearms to floor for an even deeper version"] },
    { name:"Supine Twist", area:"Spine & Hip Rotators", emoji:"🌀", sets:"2 × 60 sec each side", notes:"On back, drop knees to one side, arms out. Releases spine and hip rotators after a full week.", tip:"Let gravity do the work — don't force the knees down, just relax and let them fall", howto:["Lie on your back, arms out wide in a T","Bring knees to chest","Let both knees fall to one side","Gaze toward the opposite direction","Breathe and let everything release","60 seconds, bring knees back up, switch"] },
    { name:"Full Hip Wind Flow", area:"Full Hip Integration", emoji:"💃", sets:"2 × 2 minutes", notes:"Put on music, combine circles, figure 8s, pops and winds freely. Expression, not exercise.", tip:"Stop thinking and start feeling — this is where the week's training becomes movement", howto:["Put on a song you love","Start with slow hip circles to warm into it","Add figure 8s, pops, winds — whatever feels good","Let movements flow into each other naturally","No right or wrong — this is YOUR movement","2 full minutes of free expression"] },
    { name:"Deep Squat Hold", area:"Hips, Ankles & Inner Thighs", emoji:"🧘", sets:"3 × 60 sec hold", notes:"Heels flat if possible, hands pressed against inner knees. The ultimate hip opener to close the week.", tip:"Elevate heels on a rolled mat if they don't reach the floor — work toward flat over time", howto:["Stand feet wider than shoulder-width, toes out","Lower into the deepest squat you can","Try to keep heels flat on the floor","Press hands against inner knees to gently push them out","Sit tall — don't collapse forward","Hold 60 seconds, breathe, stand slowly"] }
  ]}
];
</script>
<script type="text/babel">
var useState = React.useState;

function Card(props) {
  var ex = props.ex, isDone = props.isDone, isOpen = props.isOpen;
  return React.createElement("div", { style:{background:isDone?"#0f1f0f":"#1a0030",border:"2px solid "+(isDone?"#166534":"#3b0764"),borderRadius:12,padding:"14px 16px",marginBottom:12} },
    React.createElement("div", { onClick:props.onCheck, style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6,cursor:"pointer"} },
      React.createElement("div", { style:{display:"flex",alignItems:"center",gap:8} },
        React.createElement("span", { style:{fontSize:20} }, ex.emoji),
        React.createElement("div", null,
          React.createElement("div", { style:{fontWeight:700,fontSize:14,color:isDone?"#4ade80":"white"} }, (isDone?"✅ ":"")+ex.name),
          React.createElement("div", { style:{fontSize:11,color:"#7c3aed",fontWeight:600,marginTop:2} }, ex.area)
        )
      ),
      React.createElement("div", { style:{fontSize:11,color:"#6b7280",textAlign:"right"} }, ex.sets)
    ),
    React.createElement("div", { style:{fontSize:12,color:"#9ca3af",lineHeight:1.5,marginBottom:8} }, ex.notes),
    React.createElement("div", { style:{background:"#0a0010",borderRadius:8,padding:"6px 10px",fontSize:11,color:"#c084fc",fontStyle:"italic",marginBottom:10} }, "💡 "+ex.tip),
    React.createElement("button", { onClick:props.onExpand, style:{background:isOpen?"#3b0764":"#0a0010",border:"1px solid #3b0764",borderRadius:8,padding:"6px 14px",fontSize:12,color:"#a78bfa",fontWeight:700,cursor:"pointer",width:"100%"} }, isOpen?"▲ Hide How To":"▼ How To"),
    isOpen && React.createElement("div", { style:{marginTop:10,background:"#0a0010",borderRadius:8,padding:"12px 14px"} },
      ex.howto.map(function(step,s){ return React.createElement("div",{key:s,style:{display:"flex",gap:10,marginBottom:8}}, React.createElement("span",{style:{color:"#7c3aed",fontWeight:800,fontSize:13,minWidth:20}},(s+1)+"."), React.createElement("span",{style:{color:"#e2e8f0",fontSize:12,lineHeight:1.5}},step)); })
    )
  );
}

function App() {
  var t = useState(0); var tab = t[0]; var setTab = t[1];
  var c = useState({}); var checked = c[0]; var setChecked = c[1];
  var e = useState({}); var expanded = e[0]; var setExpanded = e[1];

  var day = DAYS[tab];
  var exs = day.exercises;
  var done = exs.filter(function(_,i){ return !!checked[tab+"-"+i]; }).length;
  var pct = (done/exs.length)*100;

  function ck(key){ setChecked(function(prev){ var n=Object.assign({},prev); n[key]=!prev[key]; return n; }); }
  function ek(key){ setExpanded(function(prev){ var n=Object.assign({},prev); n[key]=!prev[key]; return n; }); }

  return React.createElement("div", { style:{fontFamily:"system-ui,sans-serif",maxWidth:460,margin:"0 auto",padding:16,backgroundColor:"#0a0010",minHeight:"100vh"} },
    React.createElement("div", { style:{background:"linear-gradient(135deg,#4a0080,#c44dff)",borderRadius:14,padding:"18px 20px",color:"white",marginBottom:16} },
      React.createElement("div", { style:{fontSize:22,fontWeight:800} }, "👑 Goddess Training"),
      React.createElement("div", { style:{fontSize:13,opacity:0.9,marginTop:2} }, "Movement · Strength · Control"),
      React.createElement("div", { style:{marginTop:10,background:"rgba(255,255,255,0.25)",borderRadius:8,height:8} },
        React.createElement("div", { style:{background:"white",borderRadius:8,height:8,width:pct+"%",transition:"width 0.3s"} })
      ),
      React.createElement("div", { style:{fontSize:12,opacity:0.85,marginTop:4} }, done+" of "+exs.length+" complete"+(done===exs.length?" 👑 DONE!":""))
    ),
    React.createElement("div", { style:{display:"flex",background:"#1a0030",borderRadius:10,padding:4,marginBottom:12,gap:4} },
      DAYS.map(function(d,i){ return React.createElement("button",{key:i,onClick:function(){setTab(i);setChecked({});},style:{flex:1,padding:"8px 2px",borderRadius:8,border:"none",cursor:"pointer",fontSize:10,fontWeight:700,background:tab===i?"#7c3aed":"transparent",color:tab===i?"white":"#9ca3af"}},d.label); })
    ),
    React.createElement("div", { style:{background:"#1a0030",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#a78bfa",marginBottom:14,fontWeight:600} }, day.title+" · "+day.sub),
    exs.map(function(ex,i){
      var ckey=tab+"-"+i, ekey=tab+"-e-"+i;
      return React.createElement(Card,{key:i,ex:ex,isDone:!!checked[ckey],isOpen:!!expanded[ekey],onCheck:function(){ck(ckey);},onExpand:function(ev){ev.stopPropagation();ek(ekey);}});
    }),
    React.createElement("div", { style:{marginTop:16,background:"#1a0030",borderRadius:10,padding:"14px 16px",fontSize:12,color:"#c084fc",fontWeight:600,textAlign:"center",border:"1px solid #3b0764"} }, "👑 Consistency builds goddesses. Show up for yourself every week.")
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
