            style:{background:isCur?pc:'#0a0010',color:isCur?'white':pc,borderColor:pc}},
            React.createElement('div',null,'Wk '+w),
            React.createElement('div',{style:{fontSize:9,opacity:0.8}},getPhaseLabel(w).slice(0,3).toUpperCase())
          );
        })
      )
    ),

    isLog&&React.createElement(HistoryView,{key:histRefresh}),

    !isLog&&React.createElement('div',null,
      React.createElement('div',{className:'active-date-bar'},
        React.createElement('span',null,'📅 ',React.createElement('strong',null,isToday?'Today ('+friendlyDate(logDate)+')':friendlyDate(logDate))),
        React.createElement('div',{style:{display:'flex',gap:6}},
          !isToday&&React.createElement('button',{className:'today-btn',onClick:function(){setLogDate(todayStr());setShowCal(false);}},'Today'),
          React.createElement('button',{className:'today-btn',onClick:function(){setShowCal(function(v){return !v;});},style:{borderColor:'#c084fc',color:'#c084fc'}},showCal?'✕ Close':'📆 Change')
        )
      ),
      showCal&&React.createElement(CalendarPicker,{activeDate:logDate,onSelect:function(iso){setLogDate(iso);setShowCal(false);}}),

      React.createElement('div',{style:{display:'flex',background:'#1a0030',borderRadius:10,padding:4,marginBottom:12,gap:4}},
        React.createElement('button',{onClick:function(){setMode('gym');setChecked({});},style:{flex:1,padding:'8px 4px',borderRadius:8,border:'none',cursor:'pointer',fontSize:11,fontWeight:700,background:!isHome?'#7c3aed':'transparent',color:!isHome?'white':'#9ca3af'}},'🏋️ Gym'),
        React.createElement('button',{onClick:function(){setMode('home');setChecked({});},style:{flex:1,padding:'8px 4px',borderRadius:8,border:'none',cursor:'pointer',fontSize:11,fontWeight:700,background:isHome?'#059669':'transparent',color:isHome?'white':'#9ca3af'}},'🏠 At Home')
      ),

      React.createElement('div',{style:{display:'flex',background:'#1a0030',borderRadius:10,padding:4,marginBottom:12,gap:4}},
        DAY_LABELS.map(function(d,i){return React.createElement('button',{key:i,onClick:function(){setTab(i);},style:{flex:1,padding:'8px 2px',borderRadius:8,border:'none',cursor:'pointer',fontSize:10,fontWeight:700,background:tab===i?phaseColor:'transparent',color:tab===i?'white':'#9ca3af'}},d);})
      ),

      React.createElement('div',{style:{background:'#1a0030',borderRadius:8,padding:'10px 14px',fontSize:12,color:isHome?'#4ade80':'#a78bfa',marginBottom:14,fontWeight:600}},
        DAY_TITLES[tab]+' · '+(isHome?DAY_SUBS_HOME[tab]:DAY_SUBS_GYM[tab])
      ),

      exs.map(function(ex,i){
        var ckey=mode+'-'+week+'-'+tab+'-'+i;
        var ekey=mode+'-'+week+'-'+tab+'-e-'+i;
        var lkey=mode+'-'+week+'-'+tab+'-l-'+i;
        return React.createElement(Card,{key:ex.name+i,ex:ex,isDone:!!checked[ckey],isOpen:!!expanded[ekey],showLog:!!logOpen[lkey],isHome:isHome,logDate:logDate,
          onCheck:function(){ck(ckey);},
          onExpand:function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();ek(ekey);},
          onToggleLog:function(){lk(lkey);},
          onLogSaved:function(){setHistRefresh(function(x){return x+1;});}
        });
      }),

      React.createElement('div',{style:{marginTop:16,background:'#1a0030',borderRadius:10,padding:'14px 16px',fontSize:12,color:'#c084fc',fontWeight:600,textAlign:'center',border:'1px solid #3b0764'}},'👑 The booty app builds the muscle. The goddess app builds the control.')
    )
  );
}

ReactDOM.render(React.createElement(App,null),document.getElementById('root'));
</script>
</body>
</html>
