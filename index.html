<!DOCTYPE html>

<div id="root"></div>
<script>

var DAYS = [
  { label:"MON", title:"🌀 Hip Isolation & Winding", sub:"Slow control · Feel every movement", homesub:"Zero equipment · Do it anywhere", exercises:[
    { name:"Standing Hip Circles", area:"Hips & Mobility", emoji:"🌀", sets:"3 × 20 each direction", notes:"Slow and controlled, make them big and deliberate. Upper body stays completely still.", tip:"The bigger and slower the circle, the more you feel the hip flexors release", home:"This IS the at-home version — zero equipment needed. Do it anywhere.", homesets:"3 × 20 each direction", howto:["Stand feet hip-width, hands on waist","Rotate hips in a full wide circle — go slow","Keep shoulders and chest completely still","20 circles one direction, then reverse","Feel the hip socket opening up","Bigger is better — maximize the range"] },
    { name:"Figure 8 Hip Rolls", area:"Hip Mobility & Control", emoji:"🎵", sets:"3 × 30 seconds", notes:"Draw a figure 8 with your hips. Upper body stays completely still throughout.", tip:"Imagine tracing a figure 8 on the floor — front to side, not just side to side", home:"This IS the at-home version — zero equipment. Just you and your hips.", homesets:"3 × 30 seconds", howto:["Stand feet hip-width, slight knee bend","Shift hips right and forward","Roll through center, shift left and back","Connect into a fluid figure 8 shape","Upper body stays still throughout","Start slow, find the shape before adding speed"] },
    { name:"Isolated Hip Pops", area:"Hip Isolation", emoji:"💥", sets:"3 × 20 each side", notes:"Pop one hip out at a time, freeze at the top. Isolation — not a full sway.", tip:"Think click not swing — sharp pop then hold, that builds control", home:"This IS the at-home version — zero equipment. Focus on the sharp isolation.", homesets:"3 × 20 each side", howto:["Stand feet together or hip-width","Pop RIGHT hip out sharply — freeze at the top","Return to center","Pop LEFT hip out sharply — freeze","Keep upper body absolutely still","Each pop is intentional and sharp, not a swing"] },
    { name:"Kneeling Hip Winds", area:"Hip Control & Core", emoji:"🧎", sets:"3 × 30 seconds", notes:"On knees, wind hips in slow circles. Kneeling isolates the movement beautifully.", tip:"Kneeling removes leg momentum — everything comes purely from the hip", home:"Use a yoga mat or folded towel under knees. Zero other equipment needed.", homesets:"3 × 30 seconds", howto:["Kneel upright, knees hip-width","Place hands on thighs or waist","Wind hips in slow full circles","Keep torso tall and still","Focus on rotating from the hip joint","30 seconds, then switch direction"] },
    { name:"Pelvic Tilts", area:"Core & Hip Foundation", emoji:"🔄", sets:"3 × 15", notes:"Standing, tuck and release pelvis — this is your base movement for everything else.", tip:"Master this and all hip movement opens up — it is the foundation", home:"This IS the at-home version — zero equipment. The foundation of everything.", homesets:"3 × 15", howto:["Stand feet hip-width, slight knee bend","Tuck pelvis forward — feel lower abs engage","Release and arch slightly back — lower back opens","Move slowly between the two positions","Keep movement isolated to the pelvis only","15 reps, breathe through each one"] },
    { name:"Deep Butterfly Stretch", area:"Inner Thighs & Hips", emoji:"🦋", sets:"2 × 60 sec hold", notes:"Sit tall, press knees toward floor gently. Breathe into the stretch — never force.", tip:"Sit on a folded blanket if hips are tight — elevation helps knees drop naturally", home:"Sit on the floor anywhere. Use a pillow under hips if needed.", homesets:"2 × 60 sec hold", howto:["Sit on floor, soles of feet together","Sit TALL — do not let back round","Gently press knees toward floor with elbows","Hold and breathe deeply — relax into it","Each exhale, let knees drop a little further","Never force — this is a patience stretch"] }
  ]},
  { label:"TUE", title:"🔥 Twerk & Bounce Control", sub:"Rhythm and power · Feel the music", homesub:"Add band above knees for extra burn", exercises:[
    { name:"Sumo Squat Pulses", area:"Glutes & Inner Thighs", emoji:"🔥", sets:"3 × 30 pulses", notes:"Stay low in the squat the entire time. Small fast bounces — feel the burn build.", tip:"The lower you stay, the more you get — do not rise up between pulses", home:"Add resistance band above knees for extra inner thigh and glute burn. Same movement.", homesets:"3 × 30 pulses", howto:["Feet wide, toes pointed out 45 degrees","Lower into sumo squat — stay there","Pulse up and down SMALL from that position","Range of motion is only 2-3 inches","Stay in the burn — do not stand up","30 continuous pulses, then rest"] },

    { name:"Pop Squats", area:"Glutes & Cardio Power", emoji:"⚡", sets:"3 × 15", notes:"Jump feet out to squat, jump back in — explosive and rhythmic.", tip:"Land soft every time — quiet feet means absorbing through muscle not joints", home:"Zero equipment needed. Clear a small space and go.", homesets:"3 × 15", howto:["Start with feet together","Jump feet out wide, land in squat position","Immediately jump feet back together","Keep the rhythm — feel the music","Soft landings every single time","15 reps equals 15 jumps out and in"] },

    { name:"Hip Flexor Stretch", area:"Hip Flexors — Recovery", emoji:"🧘", sets:"2 × 60 sec each side", notes:"Low lunge, sink hips forward and down. Essential after all the bounce work.", tip:"Squeeze the BACK glute while you sink — deepens the hip flexor stretch dramatically", home:"Zero equipment. Use a mat or folded towel under back knee.", homesets:"2 × 60 sec each side", howto:["Step into a low lunge","Back knee on the floor, front foot flat","Sink hips FORWARD and DOWN","Squeeze back glute to increase the stretch","Hold and breathe — do not bounce","60 seconds, then switch sides"] }
  ]},
  { label:"WED", title:"💪 Core Stamina", sub:"Deep core · Slow and controlled", homesub:"Bodyweight only · Zero equipment", exercises:[
    { name:"Dead Bug", area:"Deep Core — Stability", emoji:"🐛", sets:"3 × 10 each side", notes:"Lower back stays pressed to floor the whole time — no exceptions. Slow is the point.", tip:"If your lower back lifts even slightly, make the movement smaller — range is earned", home:"This IS the at-home version — bodyweight on the floor. Perfect home exercise.", homesets:"3 × 10 each side", howto:["Lie on back, arms straight up, knees bent 90 degrees in air","Press lower back FIRMLY into floor","Slowly lower opposite arm and leg toward floor","Lower back must not lift — that is the rule","Return slowly, repeat other side","Slow is the point — do not rush this"] },
    { name:"Hollow Body Hold", area:"Full Core — Endurance", emoji:"🌙", sets:"3 × 20-30 sec hold", notes:"Arms overhead, legs extended, lower back flat — breathe through it. Do not hold your breath.", tip:"Pull your belly button through the floor — that cue locks in the hollow position", home:"Zero equipment. One of the best core holds you can do at home.", homesets:"3 × 20-30 sec hold", howto:["Lie on back, press lower back into floor","Extend arms overhead, extend legs out","Lift arms, head, shoulders and legs slightly","Lower back stays GLUED to the floor","Hold and breathe — do not quit early","Bend knees slightly to modify if needed"] },
    { name:"Slow Mountain Climbers", area:"Core & Hip Flexors", emoji:"🏔️", sets:"3 × 20 each leg", notes:"3 seconds each rep — this is deep core work, not cardio. Slow kills the rep.", tip:"The slower you go, the more your transverse abdominis fires — speed loses the benefit", home:"Zero equipment. Just needs floor space.", homesets:"3 × 20 each leg", howto:["Start in plank, wrists under shoulders","Slowly drive one knee toward chest — 3 full seconds","Hold briefly at chest","Slowly extend back to plank — 3 full seconds","Switch legs","Keep hips level — do not rock side to side"] },
    { name:"Hip Dip Plank", area:"Obliques & Waist", emoji:"↔️", sets:"3 × 15 each side", notes:"Side plank, dip hip to floor and back up. This is what builds waist definition.", tip:"Slow and controlled — momentum does not build the waist, control does", home:"Zero equipment. Great for waist definition at home.", homesets:"3 × 15 each side", howto:["Get into side plank — elbow under shoulder","Body in a straight line, hips stacked","Lower hip toward floor slowly","Drive hip back UP squeezing obliques","Top hand on hip or reaching toward ceiling","15 dips, then flip to other side"] },
    { name:"Reverse Crunch", area:"Lower Abs", emoji:"🔄", sets:"3 × 15", notes:"Lift hips off floor using lower abs, not momentum. Slow and intentional every rep.", tip:"If you feel it in hip flexors more than abs, slow down even more", home:"Zero equipment. Control every inch of the movement.", homesets:"3 × 15", howto:["Lie on back, legs raised, knees slightly bent","Press lower back into floor","Using LOWER ABS, curl hips up off the floor","Knees move toward chest as hips lift","Lower slowly — do not just drop","Control every inch of the movement"] },
    { name:"Seated Twist Hold", area:"Obliques & Deep Core", emoji:"🌀", sets:"2 × 30 sec each side", notes:"Seated, lean back slightly, twist and hold. Feel it immediately in your obliques.", tip:"The lean-back is what activates the core — sit straight and you lose the benefit", home:"Zero equipment. Sit on the floor or a mat.", homesets:"2 × 30 sec each side", howto:["Sit on floor, knees bent, feet flat","Lean back slightly — feel abs engage","Clasp hands at chest or extend arms","Rotate torso to one side and hold","Hold for 30 seconds — breathe","Switch sides — stay leaned back the whole time"] }

  { label:"THU", title:"✨ Inner Thigh & Pelvic Floor", sub:"Precision work · Feel the detail", homesub:"Band above knees · Total control", exercises:[

    { name:"Kegels — Long Hold", area:"Pelvic Floor — Strength", emoji:"🔒", sets:"3 × 10 sec hold × 10", notes:"Squeeze, hold 10 seconds, fully release. The RELEASE matters just as much as the hold.", tip:"A full release after each hold prevents pelvic floor tightness — do not skip it", home:"Zero equipment. Do it seated on the couch or floor.", homesets:"3 × 10 sec hold × 10", howto:["Get comfortable — seated or lying works best","Contract pelvic floor muscles firmly","Hold for a full 10 seconds — count it out","FULLY release — let everything go completely","Rest 5 seconds","Repeat 10 times per set"] },
    { name:"Sumo Squat Hold & Squeeze", area:"Inner Thighs & Pelvic Floor", emoji:"🦵", sets:"3 × 10 sec hold × 10", notes:"Hold sumo squat, squeeze inner thighs toward each other isometrically. You will not move.", tip:"It is an isometric squeeze — like trying to close your legs while they stay wide open", home:"Add band above knees for extra outer glute work while you hold the inner thigh squeeze.", homesets:"3 × 10 sec hold × 10", howto:["Feet wide, toes out, lower into sumo squat","Hold the squat position","Squeeze inner thighs toward each other — isometric","You will not move — just squeeze hard","Hold 10 seconds, fully release","10 holds per set — feel the inner thigh burn build"] },
    { name:"Seated Butterfly Pulses", area:"Inner Thighs", emoji:"🦋", sets:"3 × 30 pulses", notes:"Feet together, pulse knees toward floor. Inner thigh burn builds fast — breathe through it.", tip:"Sit tall — slouching moves the work from inner thighs to your back", home:"Zero equipment. Sit on the floor, sit tall, pulse away.", homesets:"3 × 30 pulses", howto:["Sit on floor, soles of feet together","Sit up TALL — back straight","Pulse both knees toward floor rapidly","Small fast movement — inner thighs drive the pulse","30 continuous pulses per set","Breathe — do not hold your breath during the burn"] },
    { name:"Resistance Band Seated Squeeze", area:"Inner Thighs — Resistance", emoji:"🟣", sets:"3 × 20", notes:"Band around knees, seated, squeeze knees together against the band. Controlled movement.", tip:"Band should create real resistance — too easy means you need a heavier band", home:"This IS the at-home version — band above knees is all you need.", homesets:"3 × 20", howto:["Sit in a chair or on the floor","Place resistance band just above knees","Knees start pressed apart by the band","Squeeze knees TOGETHER against band resistance","Hold 1 second at the squeeze","Release slowly — do not let band snap knees back"] },
    { name:"Bridge with Pelvic Floor Hold", area:"Glutes & Pelvic Floor", emoji:"🏋️", sets:"3 × 10 reps", notes:"At the top squeeze pelvic floor AND glutes simultaneously for 3 full seconds.", tip:"This double contraction — glutes AND pelvic floor together — is the most powerful combo here", home:"This IS the at-home version — bodyweight on the floor. Add band above knees for more.", homesets:"3 × 10 reps", howto:["Lie on back, feet flat, knees bent","Drive hips up into glute bridge","At the TOP — squeeze glutes hard","SIMULTANEOUSLY contract pelvic floor","Hold both for 3 full seconds","Lower slowly, fully release, repeat"] }
  ]}

function Card(props) {
  var ex = props.ex, isDone = props.isDone, isOpen = props.isOpen, isHome = props.isHome;
  return React.createElement("div", { style:{background:isDone?"#0f1f0f":"#1a0030",border:"2px solid "+(isDone?"#166534":"#3b0764"),borderRadius:12,padding:"14px 16px",marginBottom:12} },
    React.createElement("div", { onClick:props.onCheck, style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6,cursor:"pointer"} },
      React.createElement("div", { style:{display:"flex",alignItems:"center",gap:8} },
        React.createElement("span", { style:{fontSize:20} }, ex.emoji),
        React.createElement("div", null,
          React.createElement("div", { style:{fontWeight:700,fontSize:14,color:isDone?"#4ade80":"white"} }, (isDone?"✅ ":"")+ex.name),
          React.createElement("div", { style:{fontSize:11,color:isHome?"#4ade80":"#7c3aed",fontWeight:600,marginTop:2} }, ex.area)
        )
      ),
      React.createElement("div", { style:{fontSize:11,color:"#6b7280",textAlign:"right"} }, isHome ? ex.homesets : ex.sets)
    ),
    React.createElement("div", { style:{fontSize:12,color:"#9ca3af",lineHeight:1.5,marginBottom:8} }, isHome ? ex.home : ex.notes),
    React.createElement("div", { style:{background:"#0a0010",borderRadius:8,padding:"6px 10px",fontSize:11,color:"#c084fc",fontStyle:"italic",marginBottom:10} }, "💡 "+ex.tip),
    React.createElement("button", { onClick:props.onExpand, style:{background:isOpen?"#3b0764":"#0a0010",border:"1px solid #3b0764",borderRadius:8,padding:"6px 14px",fontSize:12,color:"#a78bfa",fontWeight:700,cursor:"pointer",width:"100%"} }, isOpen?"▲ Hide How To":"▼ How To"),
    isOpen && React.createElement("div", { style:{marginTop:10,background:"#0a0010",borderRadius:8,padding:"12px 14px"} },
      ex.howto.map(function(step,s){ return React.createElement("div",{key:s,style:{display:"flex",gap:10,marginBottom:8}}, React.createElement("span",{style:{color:"#7c3aed",fontWeight:800,fontSize:13,minWidth:20}},(s+1)+"."), React.createElement("span",{style:{color:"#e2e8f0",fontSize:12,lineHeight:1.5}},step)); })
    )
  );
}

function App() {
  var t = useState(0); var tab = t[0]; var setTab = t[1];
  var m = useState("gym"); var mode = m[0]; var setMode = m[1];
  var c = useState({}); var checked = c[0]; var setChecked = c[1];
  var e = useState({}); var expanded = e[0]; var setExpanded = e[1];

  var isHome = mode === "home";
  var day = DAYS[tab];
  var exs = day.exercises;
  var done = exs.filter(function(_,i){ return !!checked[mode+"-"+tab+"-"+i]; }).length;
  var pct = (done/exs.length)*100;

  function ck(key){ setChecked(function(prev){ var n=Object.assign({},prev); n[key]=!prev[key]; return n; }); }
  function ek(key){ setExpanded(function(prev){ var n=Object.assign({},prev); n[key]=!prev[key]; return n; }); }

  var headerBg = isHome ? "linear-gradient(135deg,#064e3b,#059669)" : "linear-gradient(135deg,#4a0080,#c44dff)";

  return React.createElement("div", { style:{fontFamily:"system-ui,sans-serif",maxWidth:460,margin:"0 auto",padding:16,backgroundColor:"#0a0010",minHeight:"100vh"} },
    React.createElement("div", { style:{background:headerBg,borderRadius:14,padding:"18px 20px",color:"white",marginBottom:16} },
      React.createElement("div", { style:{fontSize:22,fontWeight:800} }, "👑 Goddess Training"),
      React.createElement("div", { style:{fontSize:13,opacity:0.9,marginTop:2} }, isHome ? "🏠 At Home Edition · Bands & Bodyweight" : "Mon · Tue · Wed · Thu · Movement · Strength · Control"),
      React.createElement("div", { style:{marginTop:10,background:"rgba(255,255,255,0.25)",borderRadius:8,height:8} },
        React.createElement("div", { style:{background:"white",borderRadius:8,height:8,width:pct+"%",transition:"width 0.3s"} })
      ),
      React.createElement("div", { style:{fontSize:12,opacity:0.85,marginTop:4} }, done+" of "+exs.length+" complete"+(done===exs.length?" 👑 DONE!":""))
    ),

    React.createElement("div", { style:{display:"flex",background:"#1a0030",borderRadius:10,padding:4,marginBottom:12,gap:4} },
      React.createElement("button", { onClick:function(){setMode("gym");setChecked({});}, style:{flex:1,padding:"8px 4px",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,background:!isHome?"#7c3aed":"transparent",color:!isHome?"white":"#9ca3af"} }, "🏋️ Gym"),
      React.createElement("button", { onClick:function(){setMode("home");setChecked({});}, style:{flex:1,padding:"8px 4px",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,background:isHome?"#059669":"transparent",color:isHome?"white":"#9ca3af"} }, "🏠 At Home")
    ),

    React.createElement("div", { style:{display:"flex",background:"#1a0030",borderRadius:10,padding:4,marginBottom:12,gap:4} },
      DAYS.map(function(d,i){ return React.createElement("button",{key:i,onClick:function(){setTab(i);},style:{flex:1,padding:"8px 2px",borderRadius:8,border:"none",cursor:"pointer",fontSize:10,fontWeight:700,background:tab===i?"#7c3aed":"transparent",color:tab===i?"white":"#9ca3af"}},d.label); })
    ),

    React.createElement("div", { style:{background:"#1a0030",borderRadius:8,padding:"10px 14px",fontSize:12,color:isHome?"#4ade80":"#a78bfa",marginBottom:14,fontWeight:600} },
      day.title+" · "+(isHome ? day.homesub : day.sub)
    ),

    exs.map(function(ex,i){
      var ckey=mode+"-"+tab+"-"+i, ekey=mode+"-"+tab+"-e-"+i;
      return React.createElement(Card,{key:i,ex:ex,isDone:!!checked[ckey],isOpen:!!expanded[ekey],isHome:isHome,onCheck:function(){ck(ckey);},onExpand:function(ev){ev.stopPropagation();ek(ekey);}});
    }),

    React.createElement("div", { style:{marginTop:16,background:"#1a0030",borderRadius:10,padding:"14px 16px",fontSize:12,color:"#c084fc",fontWeight:600,textAlign:"center",border:"1px solid #3b0764"} }, "👑 Consistency builds goddesses. Show up Mon through Thu every week.")
  );
}

ReactDOM.render(React.createElement(App, null), document.getElementById("root"));
</script>
