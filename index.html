<!DOCTYPE html>
<html lang="en">
<head>

<script>
var DAYS = [
  { label:"UPPER", title:"💪 Upper Body", sub:"Mon & Thu · Chest, back, shoulders, arms · Rest 90 sec", exercises:[
    { name:"Chest Press", area:"Chest & Shoulders", emoji:"💪", sets:"3 × 10-12", weights:["10-15 lb each","15-20 lb each","20-25 lb each"], notes:"Machine or dumbbells. Push away from chest, lower slowly 3 counts.", tip:"Keep shoulder blades pinched back — protects shoulders and isolates chest", howto:["Lie on bench or sit in machine, weights at chest level","Shoulder blades pinched together and pressed into bench","Push weight away from chest — exhale as you push","Don't lock elbows at top — keep slight bend","Lower slowly — 3 full counts down — feel the chest stretch","The slow lowering phase builds more strength than the push"] },
    { name:"Lat Pulldown", area:"Back & Lats", emoji:"🔙", sets:"3 × 10-12", weights:["Light-moderate","Moderate","Moderate-heavy"], notes:"Grip slightly wider than shoulders. Lead with elbows, not hands.", tip:"Think: pull your elbows into your back pockets — this cue changes everything", howto:["Grip bar slightly wider than shoulder-width, overhand","Sit tall, slight lean back, chest up","Pull bar down to upper chest — lead with ELBOWS","Squeeze shoulder blades together at bottom","Hold 1 second — feel lats fully contracted","Let bar rise slowly — full stretch at top before next rep"] },

    { name:"Bicep Curl", area:"Biceps", emoji:"🤜", sets:"3 × 12", weights:["10 lb each","12-15 lb each","15-20 lb each"], notes:"Elbows glued to sides. Lower ALL the way down — full range.", tip:"Rotate palm fully up at the top for full bicep contraction", howto:["Stand with dumbbells at sides, palms forward","Elbows pressed firmly against sides — they don't move","Curl up — rotate palm fully up as you reach top","Squeeze bicep hard at top","Lower ALL the way down — full extension before next rep","No swinging — if swinging, weight is too heavy"] },
    { name:"Tricep Pushdown", area:"Triceps", emoji:"💪", sets:"3 × 12", weights:["Light","Light-moderate","Moderate"], notes:"Cable machine, elbows at sides. Push straight down — fully straighten arms.", tip:"Elbows are the anchor — they stay pinned to sides throughout", howto:["Face cable machine, grip bar at chest height","Elbows bent 90°, pressed against sides","Push bar down until arms fully straight","Squeeze triceps hard at bottom","Let bar rise slowly — control the weight up","Only forearms move — elbows stay locked"] }
  ]},
  { label:"LOWER", title:"🦵 Lower Body", sub:"Tue & Fri · Legs, glutes, calves · Rest 90-120 sec", exercises:[
    { name:"Goblet Squat", area:"Quads & Glutes", emoji:"🦵", sets:"3 × 12", weights:["15-20 lb dumbbell","25-30 lb","35-40 lb"], notes:"Hold at chest, sit back and down. Push knees out throughout.", tip:"Use elbows to push knees wider at the bottom — opens hips deeper", howto:["Hold dumbbell vertically at chest, feet shoulder-width","Squat down — sit back AND down, pushing knees out","Chest tall — don't fold forward","Elbows press knees out at the bottom","Drive through full foot to stand","Squeeze glutes at top before next rep"] },
    { name:"Romanian Deadlift", area:"Hamstrings & Glutes", emoji:"🏋️", sets:"3 × 10", weights:["20-25 lb dumbbells","30-35 lb","40-50 lb"], notes:"Hinge at hips, push butt back. Flat back the entire movement.", tip:"Imagine your back is a table — keep it flat enough to set a glass on", howto:["Stand with dumbbells in front of thighs, soft knee bend","Push hips BACK — hinge at hip not waist","Lower weights along legs, keeping them close","Stop when you feel strong hamstring stretch","Drive hips forward to return — squeeze glutes hard at top","The stretch at the bottom is the point — don't rush past it"] },

  { emoji:"🏆", title:"12-Week Milestones", body:"Week 4: Exercises feel familiar. Week 8: Adding weight regularly. Week 12: Visible definition and real strength. Trust the process." }

<script type="text/babel">

    )

function App() {

  var p = useState(0); var phase = p[0]; var setPhase = p[1];
  var c = useState({}); var checked = c[0]; var setChecked = c[1];
  var e = useState({}); var expanded = e[0]; var setExpanded = e[1];

  var done = exs.filter(function(_,i){ return !!checked[tab+"-"+phase+"-"+i]; }).length;
  var pct = exs.length > 0 ? (done/exs.length)*100 : 0;

  function ck(key){ setChecked(function(prev){ var n=Object.assign({},prev); n[key]=!prev[key]; return n; }); }

      DAYS.map(function(d,i){ return React.createElement("button",{key:i,onClick:function(){setTab(i);},style:{flex:1,padding:"8px 2px",borderRadius:8,border:"none",cursor:"pointer",fontSize:10,fontWeight:700,background:tab===i?"#3aedcc":"transparent",color:tab===i?"#0a0010":"#9ca3af"}},d.label); }),
      React.createElement("button", { onClick:function(){setTab(DAYS.length);}, style:{flex:1,padding:"8px 2px",borderRadius:8,border:"none",cursor:"pointer",fontSize:10,fontWeight:700,background:tab===DAYS.length?"#3aedcc":"transparent",color:tab===DAYS.length?"#0a0010":"#9ca3af"} }, "GUIDE")

      exs.map(function(ex,i){
        var ckey=tab+"-"+phase+"-"+i, ekey=tab+"-e-"+i;
        return React.createElement(Card,{key:i,ex:ex,phase:phase,isDone:!!checked[ckey],isOpen:!!expanded[ekey],onCheck:function(){ck(ckey);},onExpand:function(ev){ev.stopPropagation();ek(ekey);}});
      })

    tab===DAYS.length && React.createElement("div", null,
      React.createElement("div", { style:{fontSize:13,fontWeight:700,color:"#3aedcc",marginBottom:12} }, "Your Goddess Training Blueprint"),
      TIPS.map(function(t,i){ return React.createElement("div",{key:i,style:{background:"#0d1f1a",border:"1px solid #0d3b2e",borderRadius:12,padding:"12px 14px",marginBottom:10}}, React.createElement("div",{style:{display:"flex",gap:10,alignItems:"flex-start"}}, React.createElement("span",{style:{fontSize:20}},t.emoji), React.createElement("div",null, React.createElement("div",{style:{fontWeight:700,fontSize:13,color:"white",marginBottom:4}},t.title), React.createElement("div",{style:{fontSize:12,color:"#9ca3af",lineHeight:1.5}},t.body)))); }),

    )

}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
